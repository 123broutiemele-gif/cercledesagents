<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents — Messages</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07111f;
      --bg2: #0d1b2e;
      --card: #102238;
      --card2: #132a43;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #9fb0c5;
      --blue: #1683ff;
      --blue2: #075985;
      --gold: #f5b942;
      --green: #25c481;
      --danger: #ef5350;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(7,89,133,.45), transparent 35%),
        linear-gradient(135deg, #07111f, #0f172a 55%, #172554);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       TOPBAR
    ========================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 22px;
      background: rgba(7,17,31,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 12px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 11px;
      color: var(--gold);
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 10px 13px;
      border-radius: 12px;
      font-weight: 700;
    }

    .top-btn:hover {
      background: rgba(255,255,255,.09);
    }

    /* =========================
       PAGE
    ========================== */

    .page {
      width: min(1180px, calc(100% - 24px));
      margin: 22px auto 100px;
    }

    .layout {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      gap: 18px;
    }

    .panel {
      background: rgba(16,34,56,.94);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,.20);
    }

    /* =========================
       CONVERSATIONS
    ========================== */

    .conversation-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .conversation-title {
      font-size: 20px;
      font-weight: 800;
    }

    .conversation-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .search-box {
      margin-top: 15px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 13px 42px 13px 14px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: rgba(22,131,255,.7);
    }

    .search-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .member-list {
      max-height: calc(100vh - 210px);
      overflow-y: auto;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      transition: .18s;
    }

    .member:hover {
      background: rgba(255,255,255,.05);
    }

    .member.active {
      background: rgba(22,131,255,.14);
      border-left: 3px solid var(--blue);
    }

    .avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg,#075985,#172554);
      border: 2px solid rgba(255,255,255,.10);
    }

    .initial-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      font-size: 15px;
    }

    .member-info {
      min-width: 0;
      flex: 1;
    }

    .member-name {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       CHAT
    ========================== */

    .chat {
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .empty-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(22,131,255,.13);
      font-size: 34px;
    }

    .empty-title {
      font-size: 21px;
      font-weight: 800;
    }

    .empty-text {
      max-width: 430px;
      margin: 8px auto 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .chat-header {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 17px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,.12);
    }

    .chat-header.show {
      display: flex;
    }

    .chat-user-info {
      min-width: 0;
      flex: 1;
    }

    .chat-user-name {
      font-weight: 800;
      font-size: 16px;
    }

    .chat-user-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .messages {
      flex: 1;
      min-height: 480px;
      max-height: calc(100vh - 235px);
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .date-separator {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin: 10px 0;
    }

    .message-row {
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 540px);
      padding: 11px 14px;
      border-radius: 17px;
      background: #19314c;
      border: 1px solid rgba(255,255,255,.06);
      line-height: 1.45;
      word-break: break-word;
    }

    .mine .bubble {
      background: linear-gradient(135deg,#075985,#1268a3);
      border-bottom-right-radius: 5px;
    }

    .message-row:not(.mine) .bubble {
      border-bottom-left-radius: 5px;
    }

    .message-time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      color: rgba(255,255,255,.58);
      text-align: right;
    }

    .composer {
      display: none;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,.14);
    }

    .composer.show {
      display: flex;
    }

    .composer textarea {
      flex: 1;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.20);
      color: var(--text);
      outline: none;
    }

    .composer textarea:focus {
      border-color: rgba(22,131,255,.7);
    }

    .send-btn {
      width: 50px;
      min-width: 50px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg,#f5b942,#f59e0b);
      color: #111827;
      font-size: 20px;
      font-weight: 900;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       STATUS
    ========================== */

    .status {
      display: none;
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: rgba(239,83,80,.12);
      border: 1px solid rgba(239,83,80,.30);
      color: #ffb4b1;
    }

    .status.success {
      background: rgba(37,196,129,.12);
      border: 1px solid rgba(37,196,129,.30);
      color: #9ff0cd;
    }

    .loading {
      padding: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MOBILE NAV
    ========================== */

    .mobile-nav {
      display: none;
      position: fixed;
      z-index: 100;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      background: rgba(7,17,31,.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      grid-template-columns: repeat(4,1fr);
    }

    .mobile-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .mobile-nav a.active {
      color: var(--gold);
    }

    .mobile-nav span:first-child {
      font-size: 19px;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 850px) {

      .topbar {
        padding: 8px 12px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand-title {
        font-size: 15px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .top-actions .top-btn span {
        display: none;
      }

      .page {
        width: 100%;
        margin: 0 0 80px;
      }

      .layout {
        display: block;
      }

      .panel {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .conversation-panel {
        display: block;
      }

      .conversation-panel.hidden-mobile {
        display: none;
      }

      .chat {
        min-height: calc(100vh - 70px);
      }

      .messages {
        min-height: calc(100vh - 210px);
        max-height: none;
        padding: 15px;
      }

      .bubble {
        max-width: 82%;
      }

      .mobile-nav {
        display: grid;
      }
    }

    @media (min-width: 851px) {
      .chat-panel {
        min-height: 650px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOPBAR
  ========================== -->

  <header class="topbar">

    <a href="accueil.html" class="brand">
      <img src="logo-aigle.png" alt="Cercle des Agents">

      <div class="brand-text">
        <div class="brand-title">Cercle des Agents</div>
        <div class="brand-subtitle">Unis • Informés • Plus forts</div>
      </div>
    </a>

    <div class="top-actions">
      <a href="accueil.html" class="top-btn">
        🏠 <span>Accueil</span>
      </a>

      <a href="profil.html" class="top-btn">
        👤 <span>Profil</span>
      </a>
    </div>

  </header>


  <!-- =========================
       PAGE
  ========================== -->

  <main class="page">

    <div id="status" class="status"></div>

    <div class="layout">

      <!-- =========================
           LISTE DES MEMBRES
      ========================== -->

      <section id="conversationPanel" class="panel conversation-panel">

        <div class="conversation-header">

          <div class="conversation-title">
            💬 Messages
          </div>

          <div class="conversation-subtitle">
            Contactez les membres du Cercle
          </div>

          <div class="search-box">

            <input
              id="memberSearch"
              type="search"
              placeholder="Rechercher un agent..."
              autocomplete="off"
            >

            <div class="search-icon">🔎</div>

          </div>

        </div>

        <div id="memberList" class="member-list">
          <div class="loading">
            Chargement des membres...
          </div>
        </div>

      </section>


      <!-- =========================
           CONVERSATION
      ========================== -->

      <section class="panel chat-panel">

        <div id="chatEmpty" class="chat-empty">

          <div>

            <div class="empty-icon">
              💬
            </div>

            <div class="empty-title">
              Vos messages
            </div>

            <p class="empty-text">
              Sélectionnez un membre pour commencer une conversation
              privée avec lui.
            </p>

          </div>

        </div>


        <!-- CHAT HEADER -->

        <div id="chatHeader" class="chat-header">

          <button
            id="backMembersBtn"
            class="top-btn"
            type="button"
            title="Retour aux membres"
          >
            ←
          </button>

          <div id="chatAvatar"></div>

          <div class="chat-user-info">

            <div id="chatUserName" class="chat-user-name">
              —
            </div>

            <div id="chatUserMeta" class="chat-user-meta">
              —
            </div>

          </div>

        </div>


        <!-- MESSAGES -->

        <div id="messages" class="messages" style="display:none;">
        </div>


        <!-- COMPOSER -->

        <form id="composer" class="composer">

          <textarea
            id="messageInput"
            placeholder="Écrire un message..."
            maxlength="2000"
          ></textarea>

          <button
            id="sendBtn"
            class="send-btn"
            type="submit"
            title="Envoyer"
          >
            ➤
          </button>

        </form>

      </section>

    </div>

  </main>


  <!-- =========================
       MOBILE NAV
  ========================== -->

  <nav class="mobile-nav">

    <a href="accueil.html">
      <span>🏠</span>
      <span>Accueil</span>
    </a>

    <a href="membres.html">
      <span>👥</span>
      <span>Membres</span>
    </a>

    <a href="messages.html" class="active">
      <span>💬</span>
      <span>Messages</span>
    </a>

    <a href="profil.html">
      <span>👤</span>
      <span>Profil</span>
    </a>

  </nav>


<script>
  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://quzgphbougaujzqrhjza.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     VARIABLES
  ===================================================== */

  let currentUser = null;
  let members = [];
  let selectedMember = null;
  let messageChannel = null;


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const statusBox =
    document.getElementById("status");

  const memberList =
    document.getElementById("memberList");

  const memberSearch =
    document.getElementById("memberSearch");

  const chatEmpty =
    document.getElementById("chatEmpty");

  const chatHeader =
    document.getElementById("chatHeader");

  const chatAvatar =
    document.getElementById("chatAvatar");

  const chatUserName =
    document.getElementById("chatUserName");

  const chatUserMeta =
    document.getElementById("chatUserMeta");

  const messagesBox =
    document.getElementById("messages");

  const composer =
    document.getElementById("composer");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const conversationPanel =
    document.getElementById("conversationPanel");

  const backMembersBtn =
    document.getElementById("backMembersBtn");


  /* =====================================================
     UTILITAIRES
  ===================================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showStatus(message, type = "error") {

    statusBox.textContent = message;

    statusBox.className =
      "status show " + type;

    setTimeout(() => {

      statusBox.className = "status";

    }, 5000);
  }


  function getInitials(member) {

    const first =
      (member.prenom || "").trim();

    const last =
      (member.nom || "").trim();

    return (
      (first.charAt(0) +
       last.charAt(0))
      .toUpperCase()
    ) || "?";
  }


  function getFullName(member) {

    const name =
      `${member.prenom || ""} ${member.nom || ""}`
      .trim();

    return name || "Agent";
  }


  function getAvatarUrl(path) {

    if (!path) {
      return null;
    }

    if (
      path.startsWith("http://") ||
      path.startsWith("https://")
    ) {
      return path;
    }

    let clean = path
      .replace(/^avatars\//, "")
      .replace(/^\/+/, "");

    const { data } =
      supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(clean);

    return data?.publicUrl || null;
  }


  function formatDate(dateString) {

    const date =
      new Date(dateString);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleTimeString(
      "fr-FR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  function formatMemberMeta(member) {

    const parts = [];

    if (member.type_agent) {
      parts.push(formatAgentType(member.type_agent));
    }

    if (member.ville) {
      parts.push(member.ville);
    }

    return parts.join(" • ");
  }


  function formatAgentType(type) {

    const values = {
      "surete": "Agent de sûreté",
      "securite": "Agent de sécurité",
      "gardiennage": "Gardiennage",
      "superviseur": "Superviseur",
      "chef_equipe": "Chef d'équipe",
      "responsable": "Responsable",
      "autre": "Autre"
    };

    return values[type] || type || "Agent";
  }


  /* =====================================================
     AUTHENTIFICATION
  ===================================================== */

  async function checkAuth() {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();

    if (error || !data?.user) {

      window.location.href =
        "connexion.html";

      return false;
    }

    currentUser = data.user;

    return true;
  }


  /* =====================================================
     CHARGER LES MEMBRES
  ===================================================== */

  async function loadMembers() {

    memberList.innerHTML =
      `<div class="loading">
        Chargement des membres...
      </div>`;

    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .neq("id", currentUser.id)
      .order(
        "created_at",
        { ascending: false }
      );

    if (error) {

      console.error(error);

      memberList.innerHTML =
        `<div class="loading">
          Impossible de charger les membres.
        </div>`;

      showStatus(
        "Impossible de charger les membres : " +
        error.message
      );

      return;
    }

    members = data || [];

    renderMembers(members);
  }


  /* =====================================================
     AFFICHER LES MEMBRES
  ===================================================== */

  function renderMembers(list) {

    if (!list.length) {

      memberList.innerHTML =
        `<div class="loading">
          Aucun membre trouvé.
        </div>`;

      return;
    }

    memberList.innerHTML =
      list.map(member => {

        const avatar =
          getAvatarUrl(member.avatar_path);

        const active =
          selectedMember &&
          selectedMember.id === member.id
            ? "active"
            : "";

        return `

          <button
            type="button"
            class="member ${active}"
            data-id="${escapeHTML(member.id)}"
          >

            ${
              avatar
              ?
              `<img
                class="avatar"
                src="${escapeHTML(avatar)}"
                alt=""
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              >
              <div
                class="avatar initial-avatar"
                style="display:none;"
              >
                ${escapeHTML(getInitials(member))}
              </div>`
              :
              `<div class="avatar initial-avatar">
                ${escapeHTML(getInitials(member))}
              </div>`
            }

            <div class="member-info">

              <div class="member-name">
                ${escapeHTML(getFullName(member))}
              </div>

              <div class="member-meta">
                ${escapeHTML(
                  formatMemberMeta(member)
                )}
              </div>

            </div>

          </button>
        `;

      }).join("");


    document
      .querySelectorAll(".member")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset.id;

            const member =
              members.find(
                item => item.id === id
              );

            if (member) {
              openConversation(member);
            }

          }
        );

      });
  }


  /* =====================================================
     RECHERCHE MEMBRES
  ===================================================== */

  memberSearch.addEventListener(
    "input",
    () => {

      const q =
        memberSearch.value
          .trim()
          .toLowerCase();

      if (!q) {

        renderMembers(members);

        return;
      }

      const filtered =
        members.filter(member => {

          const text =
            [
              member.prenom,
              member.nom,
              member.ville,
              member.entreprise,
              member.type_agent,
              member.presentation
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

          return text.includes(q);

        });

      renderMembers(filtered);

    }
  );


  /* =====================================================
     OUVRIR UNE CONVERSATION
  ===================================================== */

  async function openConversation(member) {

    selectedMember = member;

    chatEmpty.style.display =
      "none";

    chatHeader.classList.add("show");

    messagesBox.style.display =
      "flex";

    composer.classList.add("show");

    const avatar =
      getAvatarUrl(member.avatar_path);

    if (avatar) {

      chatAvatar.innerHTML =
        `<img
          class="avatar"
          src="${escapeHTML(avatar)}"
          alt=""
        >`;

    } else {

      chatAvatar.innerHTML =
        `<div class="avatar initial-avatar">
          ${escapeHTML(getInitials(member))}
        </div>`;
    }

    chatUserName.textContent =
      getFullName(member);

    chatUserMeta.textContent =
      formatMemberMeta(member) ||
      "Membre du Cercle des Agents";


    if (
      window.innerWidth <= 850
    ) {

      conversationPanel
        .classList
        .add("hidden-mobile");

    }


    await loadMessages();

    await markMessagesAsRead();

    subscribeToMessages();

    setTimeout(() => {
      messageInput.focus();
    }, 100);
  }


  /* =====================================================
     CHARGER LES MESSAGES
  ===================================================== */

  async function loadMessages() {

    messagesBox.innerHTML =
      `<div class="loading">
        Chargement des messages...
      </div>`;

    const {
      data,
      error
    } = await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedMember.id}),and(sender_id.eq.${selectedMember.id},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        { ascending: true }
      );

    if (error) {

      console.error(error);

      messagesBox.innerHTML =
        `<div class="loading">
          Impossible de charger les messages.
        </div>`;

      showStatus(
        "Erreur de chargement des messages : " +
        error.message
      );

      return;
    }

    renderMessages(data || []);
  }


  /* =====================================================
     AFFICHER LES MESSAGES
  ===================================================== */

  function renderMessages(list) {

    if (!list.length) {

      messagesBox.innerHTML =
        `<div class="loading">
          Aucun message pour le moment.<br>
          Commencez la conversation 👋
        </div>`;

      return;
    }

    messagesBox.innerHTML =
      list.map(message => {

        const mine =
          message.sender_id === currentUser.id;

        return `

          <div
            class="message-row ${mine ? "mine" : ""}"
          >

            <div class="bubble">

              ${escapeHTML(
                message.content
              ).replace(/\n/g, "<br>")}

              <span class="message-time">
                ${escapeHTML(
                  formatDate(
                    message.created_at
                  )
                )}
                ${mine ? " ✓" : ""}
              </span>

            </div>

          </div>
        `;

      }).join("");


    scrollMessages();
  }


  /* =====================================================
     SCROLL EN BAS
  ===================================================== */

  function scrollMessages() {

    messagesBox.scrollTop =
      messagesBox.scrollHeight;
  }


  /* =====================================================
     ENVOYER UN MESSAGE
  ===================================================== */

  composer.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (!selectedMember) {
        return;
      }

      const content =
        messageInput.value.trim();

      if (!content) {
        return;
      }

      sendBtn.disabled = true;

      const {
        error
      } = await supabaseClient
        .from("messages")
        .insert({
          sender_id: currentUser.id,
          receiver_id: selectedMember.id,
          content: content
        });

      if (error) {

        console.error(error);

        showStatus(
          "Impossible d'envoyer le message : " +
          error.message
        );

        sendBtn.disabled = false;

        return;
      }

      messageInput.value = "";

      sendBtn.disabled = false;

      await loadMessages();

      messageInput.focus();
    }
  );


  /* =====================================================
     ENVOYER AVEC CTRL + ENTRÉE
  ===================================================== */

  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        event.ctrlKey
      ) {

        event.preventDefault();

        composer.requestSubmit();
      }

    }
  );


  /* =====================================================
     MARQUER COMME LU
  ===================================================== */

  async function markMessagesAsRead() {

    if (!selectedMember) {
      return;
    }

    const {
      error
    } = await supabaseClient
      .from("messages")
      .update({
        is_read: true
      })
      .eq(
        "sender_id",
        selectedMember.id
      )
      .eq(
        "receiver_id",
        currentUser.id
      )
      .eq(
        "is_read",
        false
      );

    if (error) {
      console.warn(
        "Impossible de marquer comme lu:",
        error.message
      );
    }
  }


  /* =====================================================
     TEMPS RÉEL
  ===================================================== */

  function subscribeToMessages() {

    if (messageChannel) {

      supabaseClient
        .removeChannel(messageChannel);

      messageChannel = null;
    }

    if (!selectedMember) {
      return;
    }

    messageChannel =
      supabaseClient
        .channel(
          "messages-" +
          currentUser.id +
          "-" +
          selectedMember.id
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "messages",
            filter:
              `receiver_id=eq.${currentUser.id}`
          },
          async () => {

            await loadMessages();

            await markMessagesAsRead();

          }
        )
        .subscribe();
  }


  /* =====================================================
     RETOUR AUX MEMBRES SUR MOBILE
  ===================================================== */

  backMembersBtn.addEventListener(
    "click",
    () => {

      conversationPanel
        .classList
        .remove("hidden-mobile");

      chatEmpty.style.display =
        "flex";

      chatHeader.classList.remove(
        "show"
      );

      messagesBox.style.display =
        "none";

      composer.classList.remove(
        "show"
      );

      selectedMember = null;

      if (messageChannel) {

        supabaseClient
          .removeChannel(
            messageChannel
          );

        messageChannel = null;
      }

      renderMembers(members);
    }
  );


  /* =====================================================
     INITIALISATION
  ===================================================== */

  async function init() {

    const authenticated =
      await checkAuth();

    if (!authenticated) {
      return;
    }

    await loadMembers();
  }


  init();

</script>

</body>
