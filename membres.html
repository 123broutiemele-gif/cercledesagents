<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cercle des Agents — Membres</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#075985 0%,transparent 35%),
    linear-gradient(135deg,#0f172a,#172554);
  color:#fff;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(15,23,42,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.1);
  padding:12px 16px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand{
  flex:1;
}

.brand h1{
  margin:0;
  font-size:18px;
}

.brand p{
  margin:3px 0 0;
  color:#cbd5e1;
  font-size:12px;
}

.back{
  border:0;
  background:#334155;
  color:white;
  padding:10px 13px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:22px 15px 50px;
}

.hero{
  background:rgba(30,41,59,.85);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.hero h2{
  margin:0 0 8px;
  font-size:25px;
}

.hero p{
  margin:0;
  color:#cbd5e1;
}

.search-box{
  margin-top:18px;
  position:relative;
}

.search-box input{
  width:100%;
  padding:15px 18px 15px 46px;
  border-radius:14px;
  border:1px solid #475569;
  background:#0f172a;
  color:white;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#facc15;
  box-shadow:0 0 0 3px rgba(250,204,21,.12);
}

.search-icon{
  position:absolute;
  left:16px;
  top:13px;
  font-size:20px;
}

.count{
  margin:18px 0 12px;
  color:#cbd5e1;
  font-size:14px;
}

.members{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:rgba(30,41,59,.92);
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  padding:18px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(250,204,21,.5);
}

.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin-bottom:13px;
  border:3px solid #facc15;
  background:#334155;
}

.avatar-letter{
  width:72px;
  height:72px;
  border-radius:50%;
  background:linear-gradient(135deg,#0369a1,#f59e0b);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
  margin-bottom:13px;
}

.name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:7px;
}

.type{
  display:inline-block;
  background:rgba(250,204,21,.13);
  color:#fde68a;
  border:1px solid rgba(250,204,21,.3);
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:12px;
}

.info{
  color:#cbd5e1;
  font-size:14px;
  line-height:1.6;
}

.presentation{
  margin-top:10px;
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
}

.profile-btn{
  width:100%;
  margin-top:15px;
  padding:11px;
  border:0;
  border-radius:12px;
  background:#facc15;
  color:#111827;
  font-weight:bold;
  cursor:pointer;
}

.profile-btn:hover{
  background:#fde047;
}

.loading,
.empty,
.error{
  text-align:center;
  padding:40px 20px;
  background:rgba(30,41,59,.8);
  border-radius:18px;
  color:#cbd5e1;
}

.error{
  color:#fecaca;
}

@media(max-width:850px){
  .members{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .container{
    padding:15px 12px 35px;
  }

  .hero{
    padding:18px;
  }

  .hero h2{
    font-size:21px;
  }

  .members{
    grid-template-columns:1fr;
  }

  .back{
    padding:9px 10px;
  }

  .brand h1{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <img src="logo-aigle.png" class="logo" alt="Cercle des Agents">

    <div class="brand">
      <h1>Cercle des Agents</h1>
      <p>Unis • Informés • Plus forts</p>
    </div>

    <button class="back" onclick="window.location.href='accueil.html'">
      ← Accueil
    </button>

  </div>
</header>

<main class="container">

  <section class="hero">

    <h2>👥 Membres du Cercle</h2>

    <p>
      Retrouvez les agents de sécurité privée inscrits sur le réseau.
    </p>

    <div class="search-box">

      <span class="search-icon">🔎</span>

      <input
        type="search"
        id="searchInput"
        placeholder="Rechercher un agent, une ville, une entreprise..."
        autocomplete="off"
      >

    </div>

  </section>

  <div class="count" id="count">
    Chargement des membres...
  </div>

  <section id="members" class="members">

    <div class="loading">
      ⏳ Chargement des membres...
    </div>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://quzgphbougaujzqrhjza.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Zkqah5_D7E_LKWLMp6ZFm6A_7BOyjCu1"
  .replace("Zkqah5_D7E_", "Zkqah5_D7E");

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allMembers = [];


/* Vérifier la connexion */
async function checkUser(){

  const { data, error } = await supabase.auth.getUser();

  if(error || !data.user){

    window.location.href = "connexion.html";

    return null;
  }

  return data.user;
}


/* Charger les membres */
async function loadMembers(){

  const container = document.getElementById("members");
  const count = document.getElementById("count");

  container.innerHTML = `
    <div class="loading">
      ⏳ Chargement des membres...
    </div>
  `;

  const { data, error } = await supabase
    .from("profiles")
    .select(`
      id,
      prenom,
      nom,
      ville,
      entreprise,
      type_agent,
      presentation,
      avatar_path
    `)
    .order("prenom", { ascending:true });

  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="error">
        ❌ Impossible de charger les membres.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    count.textContent = "";

    return;
  }

  allMembers = data || [];

  renderMembers(allMembers);
}


/* Affichage */
function renderMembers(members){

  const container = document.getElementById("members");
  const count = document.getElementById("count");

  count.textContent =
    `${members.length} membre${members.length > 1 ? "s" : ""}`;

  if(!members.length){

    container.innerHTML = `
      <div class="empty">
        🔎 Aucun membre trouvé.
      </div>
    `;

    return;
  }

  container.innerHTML = members.map(member => {

    const prenom = member.prenom || "";
    const nom = member.nom || "";

    const fullName =
      `${prenom} ${nom}`.trim() || "Agent";

    const firstLetter =
      fullName.charAt(0).toUpperCase();

    let avatar = "";

    if(member.avatar_path){

      avatar = `
        <img
          class="avatar"
          src="${getAvatarUrl(member.avatar_path)}"
          alt="Photo de ${escapeHtml(fullName)}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        >

        <div class="avatar-letter" style="display:none;">
          ${escapeHtml(firstLetter)}
        </div>
      `;

    }else{

      avatar = `
        <div class="avatar-letter">
          ${escapeHtml(firstLetter)}
        </div>
      `;
    }

    return `
      <article class="card">

        ${avatar}

        <div class="name">
          ${escapeHtml(fullName)}
        </div>

        ${
          member.type_agent
          ? `<div class="type">
               🛡️ ${escapeHtml(formatAgentType(member.type_agent))}
             </div>`
          : ""
        }

        <div class="info">

          ${
            member.ville
            ? `📍 ${escapeHtml(member.ville)}<br>`
            : ""
          }

          ${
            member.entreprise
            ? `🏢 ${escapeHtml(member.entreprise)}`
            : ""
          }

        </div>

        ${
          member.presentation
          ? `
            <div class="presentation">
              ${escapeHtml(member.presentation)}
            </div>
          `
          : ""
        }

        <button
          class="profile-btn"
          onclick="openProfile('${member.id}')"
        >
          👤 Voir le profil
        </button>

      </article>
    `;

  }).join("");
}


/* Recherche */
document
  .getElementById("searchInput")
  .addEventListener("input", function(){

    const search =
      this.value.trim().toLowerCase();

    if(!search){

      renderMembers(allMembers);

      return;
    }

    const filtered =
      allMembers.filter(member => {

        const text = [

          member.prenom,
          member.nom,
          member.ville,
          member.entreprise,
          member.type_agent,
          member.presentation

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(search);

      });

    renderMembers(filtered);

  });


/* Photo avatar */
function getAvatarUrl(path){

  if(!path) return "";

  if(path.startsWith("http")){

    return path;
  }

  const {
    data
  } = supabase.storage
    .from("avatars")
    .getPublicUrl(path);

  return data.publicUrl;
}


/* Type agent */
function formatAgentType(type){

  const types = {

    surete:"Agent de sûreté",

    securite:"Agent de sécurité",

    incendie:"Agent de sécurité incendie",

    cynophile:"Agent cynophile",

    rondier:"Rondier",

    gardiennage:"Agent de gardiennage",

    autre:"Autre"

  };

  return types[type] || type;
}


/* Ouvrir profil */
function openProfile(id){

  window.location.href =
    `profil.html?id=${encodeURIComponent(id)}`;

}


/* Protection HTML */
function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* Démarrage */
(async function(){

  const user = await checkUser();

  if(!user) return;

  await loadMembers();

})();

</script>

</body>
</html>
