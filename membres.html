<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents — Membres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #075985 0%, transparent 35%),
        linear-gradient(135deg, #07111f, #0f172a, #172554);
      color: white;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7, 17, 31, .95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 12px;
      background: #0f172a;
    }

    .brand {
      flex: 1;
    }

    .brand strong {
      display: block;
      font-size: 17px;
    }

    .brand span {
      color: #cbd5e1;
      font-size: 12px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 14px 100px;
    }

    .hero {
      background: rgba(30, 41, 59, .82);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
    }

    .search-box {
      margin-top: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 17px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .search-box input:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250,204,21,.1);
    }

    .status {
      margin: 15px 0;
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(15,23,42,.8);
      color: #cbd5e1;
      font-size: 14px;
    }

    .status.error {
      background: rgba(127,29,29,.4);
      border: 1px solid rgba(248,113,113,.4);
      color: #fecaca;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .members {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .member {
      background: rgba(30,41,59,.88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 17px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: .2s;
    }

    .member:hover {
      transform: translateY(-2px);
      border-color: rgba(250,204,21,.35);
    }

    .avatar {
      width: 65px;
      height: 65px;
      min-width: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, #075985, #1e3a8a);
      border: 2px solid rgba(250,204,21,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .member-info {
      min-width: 0;
      flex: 1;
    }

    .member-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .member-type {
      color: #facc15;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .detail {
      color: #cbd5e1;
      font-size: 13px;
      margin: 4px 0;
      overflow-wrap: anywhere;
    }

    .profile-btn {
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      background: #facc15;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
    }

    .profile-btn:active {
      transform: scale(.97);
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #cbd5e1;
      background: rgba(30,41,59,.7);
      border-radius: 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #facc15;
      text-decoration: none;
      font-weight: bold;
    }

    .counter {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px 10px 90px;
      }

      .hero {
        padding: 18px;
      }

      .hero h1 {
        font-size: 22px;
      }

      .members {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <img
        src="logo-aigle.png"
        class="logo"
        alt="Cercle des Agents"
      >

      <div class="brand">
        <strong>Cercle des Agents</strong>
        <span>Unis • Informés • Plus forts</span>
      </div>
    </div>
  </header>

  <main class="container">

    <a href="accueil.html" class="back">
      ← Retour à l'accueil
    </a>

    <section class="hero">

      <h1>👥 Les membres</h1>

      <p>
        Découvrez les agents inscrits sur le Cercle des Agents.
      </p>

      <div class="search-box">
        <input
          type="search"
          id="searchInput"
          placeholder="🔎 Rechercher un agent, une ville ou une entreprise..."
        >
      </div>

    </section>

    <div id="status" class="status">
      🔄 Chargement des membres...
    </div>

    <div id="counter" class="counter"></div>

    <section id="members" class="members"></section>

  </main>

<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://quzgphbougaujzqrhjza.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     VARIABLES
  ===================================================== */

  let currentUser = null;
  let allMembers = [];


  const membersContainer =
    document.getElementById("members");

  const statusBox =
    document.getElementById("status");

  const counter =
    document.getElementById("counter");

  const searchInput =
    document.getElementById("searchInput");


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showStatus(message, error = false) {

    statusBox.textContent = message;

    statusBox.className =
      error
        ? "status error"
        : "status";
  }


  /* =====================================================
     INITIALISATION
  ===================================================== */

  async function init() {

    try {

      showStatus("🔐 Vérification de votre connexion...");

      const {
        data: { user },
        error: authError
      } = await supabaseClient.auth.getUser();


      if (authError) {

        throw new Error(
          "Erreur d'authentification : " +
          authError.message
        );

      }


      if (!user) {

        showStatus(
          "⚠️ Vous devez être connecté pour consulter les membres.",
          true
        );

        membersContainer.innerHTML = `
          <div class="empty">
            <h3>Connexion nécessaire</h3>
            <p>
              Connectez-vous pour accéder aux membres.
            </p>

            <button
              class="profile-btn"
              onclick="window.location.href='connexion.html'"
            >
              Se connecter
            </button>
          </div>
        `;

        return;
      }


      currentUser = user;

      await loadMembers();

    } catch (error) {

      console.error("ERREUR INIT :", error);

      showStatus(
        "❌ Impossible d'initialiser la page.\n\n" +
        error.message,
        true
      );

    }

  }


  /* =====================================================
     CHARGER LES MEMBRES
  ===================================================== */

  async function loadMembers() {

    try {

      showStatus("🔄 Chargement des membres...");


      /*
       * IMPORTANT :
       * On utilise select("*") afin d'éviter qu'un champ
       * manquant dans la table profiles bloque toute la page.
       */

      const {
        data,
        error
      } = await supabaseClient
        .from("profiles")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      if (error) {

        console.error(
          "ERREUR SUPABASE PROFILES :",
          error
        );

        throw new Error(
          "Supabase refuse l'accès aux profils.\n\n" +
          "Message : " +
          error.message +
          "\n\n" +
          "Code : " +
          (error.code || "inconnu")
        );

      }


      allMembers = data || [];


      console.log(
        "MEMBRES CHARGÉS :",
        allMembers
      );


      showStatus(
        "✅ Membres chargés avec succès."
      );


      renderMembers(allMembers);

    } catch (error) {

      console.error(
        "ERREUR CHARGEMENT MEMBRES :",
        error
      );

      showStatus(
        "❌ ERREUR DE CHARGEMENT DES MEMBRES\n\n" +
        error.message,
        true
      );

      membersContainer.innerHTML = `
        <div class="empty">
          <h3>⚠️ Impossible d'afficher les membres</h3>

          <p>
            L'erreur exacte est affichée dans le message rouge
            ci-dessus.
          </p>
        </div>
      `;

    }

  }


  /* =====================================================
     AFFICHER LES MEMBRES
  ===================================================== */

  function renderMembers(members) {

    membersContainer.innerHTML = "";

    counter.textContent =
      members.length +
      (members.length > 1
        ? " membres"
        : " membre");


    if (members.length === 0) {

      membersContainer.innerHTML = `
        <div class="empty">

          <h3>👥 Aucun membre trouvé</h3>

          <p>
            Aucun profil n'est actuellement disponible.
          </p>

        </div>
      `;

      return;
    }


    members.forEach(member => {

      const card =
        document.createElement("article");

      card.className = "member";


      /* -------------------------
         NOM
      ------------------------- */

      const prenom =
        member.prenom ||
        member.first_name ||
        "";

      const nom =
        member.nom ||
        member.last_name ||
        "";

      const fullName =
        `${prenom} ${nom}`.trim() ||
        "Agent du Cercle";


      /* -------------------------
         TYPE D'AGENT
      ------------------------- */

      const type =
        formatAgentType(
          member.type_agent ||
          member.type ||
          ""
        );


      /* -------------------------
         VILLE
      ------------------------- */

      const ville =
        member.ville ||
        member.city ||
        "";


      /* -------------------------
         ENTREPRISE
      ------------------------- */

      const entreprise =
        member.entreprise ||
        member.company ||
        "";


      /* -------------------------
         PRÉSENTATION
      ------------------------- */

      const presentation =
        member.presentation ||
        "";


      /* -------------------------
         AVATAR
      ------------------------- */

      const avatarPath =
        member.avatar_path ||
        member.avatar ||
        "";


      let avatarHTML;


      if (avatarPath) {

        const {
          data: avatarData
        } = supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(avatarPath);


        if (
          avatarData &&
          avatarData.publicUrl
        ) {

          avatarHTML = `
            <img
              src="${escapeHTML(avatarData.publicUrl)}"
              class="avatar"
              alt="Photo de ${escapeHTML(fullName)}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >

            <div
              class="avatar"
              style="display:none;"
            >
              ${getInitials(fullName)}
            </div>
          `;

        } else {

          avatarHTML = `
            <div class="avatar">
              ${getInitials(fullName)}
            </div>
          `;

        }

      } else {

        avatarHTML = `
          <div class="avatar">
            ${getInitials(fullName)}
          </div>
        `;

      }


      /* -------------------------
         HTML
      ------------------------- */

      card.innerHTML = `

        ${avatarHTML}

        <div class="member-info">

          <div class="member-name">
            ${escapeHTML(fullName)}
          </div>

          ${
            type
              ? `
                <div class="member-type">
                  🛡️ ${escapeHTML(type)}
                </div>
              `
              : ""
          }

          ${
            ville
              ? `
                <div class="detail">
                  📍 ${escapeHTML(ville)}
                </div>
              `
              : ""
          }

          ${
            entreprise
              ? `
                <div class="detail">
                  🏢 ${escapeHTML(entreprise)}
                </div>
              `
              : ""
          }

          ${
            presentation
              ? `
                <div class="detail">
                  💬 ${escapeHTML(
                    presentation.substring(0, 100)
                  )}${presentation.length > 100 ? "..." : ""}
                </div>
              `
              : ""
          }

          <button
            class="profile-btn"
            onclick="openProfile('${escapeHTML(member.id || "")}')"
          >
            Voir le profil
          </button>

        </div>

      `;


      membersContainer.appendChild(card);

    });

  }


  /* =====================================================
     RECHERCHE
  ===================================================== */

  searchInput.addEventListener(
    "input",
    function() {

      const search =
        this.value
          .toLowerCase()
          .trim();


      if (!search) {

        renderMembers(allMembers);

        return;
      }


      const filtered =
        allMembers.filter(member => {

          const text = [

            member.prenom,
            member.nom,
            member.ville,
            member.entreprise,
            member.type_agent,
            member.presentation

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          return text.includes(search);

        });


      renderMembers(filtered);

    }
  );


  /* =====================================================
     PROFIL
  ===================================================== */

  function openProfile(id) {

    if (!id) {

      alert(
        "Ce membre ne possède pas encore d'identifiant de profil."
      );

      return;
    }


    window.location.href =
      "profil.html?id=" +
      encodeURIComponent(id);

  }


  /* =====================================================
     TYPE AGENT
  ===================================================== */

  function formatAgentType(type) {

    const types = {

      surete: "Agent de sûreté",

      securite: "Agent de sécurité",

      surveillance: "Agent de surveillance",

      incendie: "Agent de sécurité incendie",

      cynophile: "Agent cynophile",

      protection: "Agent de protection",

      autre: "Autre"

    };


    return types[type] || type;

  }


  /* =====================================================
     INITIALES
  ===================================================== */

  function getInitials(name) {

    const parts =
      name
        .trim()
        .split(/\s+/)
        .filter(Boolean);


    if (parts.length === 1) {

      return parts[0]
        .substring(0, 2)
        .toUpperCase();

    }


    return (
      parts[0][0] +
      parts[parts.length - 1][0]
    ).toUpperCase();

  }


  /* =====================================================
     PROTECTION HTML
  ===================================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     LANCER
  ===================================================== */

  init();

</script>

</body>
</html>
