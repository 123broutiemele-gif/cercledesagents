<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents — Modifier mon profil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        radial-gradient(circle at top, #075985 0%, transparent 38%),
        linear-gradient(135deg, #071426, #0f172a 55%, #172554);

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .card {
      background: rgba(15, 23, 42, 0.97);

      border: 1px solid rgba(255,255,255,0.10);

      border-radius: 24px;

      padding: 25px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        0 0 30px rgba(14,165,233,0.10);
    }

    .header {
      text-align: center;
      padding-bottom: 25px;
    }

    .logo {
      width: 100px;
      height: 100px;

      object-fit: contain;

      display: block;

      margin: 0 auto 10px;

      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.4));
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 1px;

      background: linear-gradient(
        90deg,
        #facc15,
        #fb923c,
        #38bdf8
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 6px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .intro {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* PHOTO */

    .photo-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-wrapper {
      width: 145px;
      height: 145px;

      margin: 0 auto 15px;

      border-radius: 50%;

      border: 4px solid #facc15;

      overflow: hidden;

      background:
        linear-gradient(135deg, #075985, #172554);

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.35);
    }

    #avatarPreview {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .avatar-placeholder {
      font-size: 55px;
    }

    .photo-label {
      display: inline-block;

      padding: 11px 18px;

      border-radius: 10px;

      background: #1e293b;

      border: 1px solid #334155;

      color: #facc15;

      font-weight: bold;

      cursor: pointer;
    }

    .photo-label:hover {
      background: #334155;
    }

    #photoInput {
      display: none;
    }

    .photo-info {
      color: #64748b;
      font-size: 11px;
      margin-top: 9px;
    }

    /* FORM */

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #e2e8f0;

      font-size: 14px;

      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;

      border-radius: 11px;

      border: 1px solid #334155;

      background: #0b1220;

      color: white;

      padding: 13px 14px;

      font-size: 15px;

      outline: none;

      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #38bdf8;

      box-shadow:
        0 0 0 3px rgba(56,189,248,0.10);
    }

    select {
      appearance: auto;
    }

    option {
      background: #0f172a;
      color: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    .email-info {
      color: #64748b;
      font-size: 11px;
      margin-top: 6px;
    }

    /* BUTTONS */

    .save-button {
      width: 100%;

      border: none;

      border-radius: 13px;

      padding: 15px;

      background:
        linear-gradient(
          90deg,
          #facc15,
          #fb923c
        );

      color: #111827;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      margin-top: 5px;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cancel {
      display: block;

      text-align: center;

      margin-top: 18px;

      color: #94a3b8;

      text-decoration: none;

      font-size: 14px;
    }

    .cancel:hover {
      color: white;
    }

    /* MESSAGE */

    #message {
      display: none;

      margin-bottom: 20px;

      padding: 13px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    #message.success {
      display: block;

      background: rgba(34,197,94,0.12);

      border: 1px solid rgba(34,197,94,0.30);

      color: #86efac;
    }

    #message.error {
      display: block;

      background: rgba(239,68,68,0.12);

      border: 1px solid rgba(239,68,68,0.30);

      color: #fca5a5;
    }

    .loading {
      text-align: center;

      color: #94a3b8;

      padding: 30px;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 20px;
      }

      .avatar-wrapper {
        width: 125px;
        height: 125px;
      }

      .brand {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <!-- HEADER -->

      <div class="header">

        <img
          src="logo-aigle.png"
          alt="Cercle des Agents"
          class="logo"
        >

        <div class="brand">
          CERCLE DES AGENTS
        </div>

        <div class="subtitle">
          Unis • Informés • Plus forts
        </div>

      </div>


      <h1>
        👤 Modifier mon profil
      </h1>

      <p class="intro">
        Mets à jour tes informations et ta photo de profil.
      </p>


      <div id="loading" class="loading">
        Chargement de ton profil…
      </div>


      <div id="profileContent" style="display:none;">

        <div id="message"></div>


        <!-- PHOTO -->

        <div class="photo-section">

          <div class="avatar-wrapper">

            <img
              id="avatarPreview"
              src=""
              alt="Photo de profil"
              style="display:none;"
            >

            <div
              id="avatarPlaceholder"
              class="avatar-placeholder"
            >
              👤
            </div>

          </div>


          <label
            for="photoInput"
            class="photo-label"
          >
            📷 Choisir ma photo
          </label>

          <input
            type="file"
            id="photoInput"
            accept="image/jpeg,image/png,image/webp"
          >

          <div class="photo-info">
            JPG, PNG ou WebP • maximum 5 Mo
          </div>

        </div>


        <!-- FORMULAIRE -->

        <form id="profileForm">


          <div class="field">

            <label for="prenom">
              Prénom
            </label>

            <input
              type="text"
              id="prenom"
              placeholder="Ton prénom"
              required
            >

          </div>


          <div class="field">

            <label for="nom">
              Nom
            </label>

            <input
              type="text"
              id="nom"
              placeholder="Ton nom"
              required
            >

          </div>


          <div class="field">

            <label for="email">
              Adresse e-mail
            </label>

            <input
              type="email"
              id="email"
              readonly
            >

            <div class="email-info">
              L'adresse e-mail est gérée par ton compte de connexion.
            </div>

          </div>


          <div class="field">

            <label for="ville">
              Ville
            </label>

            <input
              type="text"
              id="ville"
              placeholder="Exemple : Abidjan"
            >

          </div>


          <div class="field">

            <label for="entreprise">
              Entreprise
            </label>

            <input
              type="text"
              id="entreprise"
              placeholder="Nom de ton entreprise"
            >

          </div>


          <div class="field">

            <label for="typeAgent">
              Type d'agent
            </label>

            <select id="typeAgent">

              <option value="">
                Sélectionner
              </option>

              <option value="surete">
                Agent de sûreté
              </option>

              <option value="securite">
                Agent de sécurité
              </option>

              <option value="gardiennage">
                Agent de gardiennage
              </option>

              <option value="protection">
                Agent de protection rapprochée
              </option>

              <option value="incendie">
                Agent de sécurité incendie
              </option>

              <option value="autre">
                Autre
              </option>

            </select>

          </div>


          <div class="field">

            <label for="presentation">
              Présentation
            </label>

            <textarea
              id="presentation"
              placeholder="Présente-toi en quelques mots..."
            ></textarea>

          </div>


          <button
            type="submit"
            class="save-button"
            id="saveButton"
          >
            💾 Enregistrer mon profil
          </button>

        </form>


        <a
          href="profil.html"
          class="cancel"
        >
          ← Retour à mon profil
        </a>

      </div>

    </section>

  </main>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://quzgphbougaujzqrhjza.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loading =
      document.getElementById("loading");

    const profileContent =
      document.getElementById("profileContent");

    const message =
      document.getElementById("message");

    const form =
      document.getElementById("profileForm");

    const photoInput =
      document.getElementById("photoInput");

    const avatarPreview =
      document.getElementById("avatarPreview");

    const avatarPlaceholder =
      document.getElementById("avatarPlaceholder");

    const saveButton =
      document.getElementById("saveButton");


    let currentUser = null;

    let selectedPhoto = null;

    let currentAvatarPath = null;


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    // ==========================================
    // CHARGER LE PROFIL
    // ==========================================

    async function loadProfile() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getUser();


        // IMPORTANT :
        // On ne redirige PAS vers inscription.html.
        // Si l'utilisateur n'est pas connecté,
        // on le renvoie simplement vers connexion.

        if (
          error ||
          !data ||
          !data.user
        ) {

          window.location.href =
            "connexion.html";

          return;
        }


        currentUser =
          data.user;


        // E-mail provenant de Auth

        document.getElementById("email").value =
          currentUser.email || "";


        // Recherche du profil

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(`
              id,
              prenom,
              nom,
              email,
              ville,
              entreprise,
              type_agent,
              presentation,
              avatar_path
            `)
            .eq("id", currentUser.id)
            .maybeSingle();


        if (profileError) {

          console.error(
            "Erreur profil:",
            profileError
          );

          showMessage(
            "Impossible de charger les informations du profil.",
            "error"
          );

        }


        // ======================================
        // REMPLIR LES CHAMPS
        // ======================================

        if (profile) {

          document.getElementById("prenom").value =
            profile.prenom || "";

          document.getElementById("nom").value =
            profile.nom || "";

          document.getElementById("ville").value =
            profile.ville || "";

          document.getElementById("entreprise").value =
            profile.entreprise || "";

          document.getElementById("typeAgent").value =
            profile.type_agent || "";

          document.getElementById("presentation").value =
            profile.presentation || "";


          currentAvatarPath =
            profile.avatar_path || null;


          // ====================================
          // AFFICHER AVATAR EXISTANT
          // ====================================

          if (currentAvatarPath) {

            const {
              data: publicData
            } =
              supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(
                  currentAvatarPath
                );


            if (
              publicData &&
              publicData.publicUrl
            ) {

              avatarPreview.src =
                publicData.publicUrl +
                "?t=" +
                Date.now();

              avatarPreview.style.display =
                "block";

              avatarPlaceholder.style.display =
                "none";

            }

          }

        }


        loading.style.display =
          "none";

        profileContent.style.display =
          "block";

      }

      catch (error) {

        console.error(error);

        loading.textContent =
          "Une erreur est survenue.";

      }

    }


    // ==========================================
    // CHOIX PHOTO
    // ==========================================

    photoInput.addEventListener(
      "change",
      function () {

        const file =
          this.files[0];


        if (!file) {

          selectedPhoto = null;

          return;

        }


        // Vérification format

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];


        if (
          !allowedTypes.includes(
            file.type
          )
        ) {

          showMessage(
            "Format non accepté. Utilise JPG, PNG ou WebP.",
            "error"
          );

          this.value = "";

          selectedPhoto = null;

          return;
        }


        // Vérification taille : 5 Mo

        if (
          file.size >
          5 * 1024 * 1024
        ) {

          showMessage(
            "La photo est trop grande. Maximum : 5 Mo.",
            "error"
          );

          this.value = "";

          selectedPhoto = null;

          return;
        }


        selectedPhoto =
          file;


        // Aperçu

        const reader =
          new FileReader();


        reader.onload =
          function (event) {

            avatarPreview.src =
              event.target.result;

            avatarPreview.style.display =
              "block";

            avatarPlaceholder.style.display =
              "none";

          };


        reader.readAsDataURL(file);

      }
    );


    // ==========================================
    // ENREGISTREMENT
    // ==========================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        if (!currentUser) {

          showMessage(
            "Session utilisateur introuvable. Reconnecte-toi.",
            "error"
          );

          return;
        }


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Enregistrement…";


        try {

          let avatarPath =
            currentAvatarPath;


          // ====================================
          // UPLOAD PHOTO SI UNE NOUVELLE PHOTO
          // ====================================

          if (selectedPhoto) {

            let extension =
              "jpg";


            if (
              selectedPhoto.type ===
              "image/png"
            ) {

              extension =
                "png";

            }


            if (
              selectedPhoto.type ===
              "image/webp"
            ) {

              extension =
                "webp";

            }


            avatarPath =
              currentUser.id +
              "/avatar." +
              extension;


            const {
              error: uploadError
            } =
              await supabaseClient
                .storage
                .from("avatars")
                .upload(
                  avatarPath,
                  selectedPhoto,
                  {
                    cacheControl: "3600",
                    upsert: true,
                    contentType:
                      selectedPhoto.type
                  }
                );


            if (uploadError) {

              console.error(
                "Erreur upload:",
                uploadError
              );

              throw new Error(
                "La photo n'a pas pu être envoyée. " +
                uploadError.message
              );

            }

          }


          // ====================================
          // ENREGISTRER LE PROFIL
          // ====================================

          const profileData = {

            id:
              currentUser.id,

            prenom:
              document
                .getElementById("prenom")
                .value
                .trim(),

            nom:
              document
                .getElementById("nom")
                .value
                .trim(),

            email:
              currentUser.email,

            ville:
              document
                .getElementById("ville")
                .value
                .trim(),

            entreprise:
              document
                .getElementById("entreprise")
                .value
                .trim(),

            type_agent:
              document
                .getElementById("typeAgent")
                .value,

            presentation:
              document
                .getElementById("presentation")
                .value
                .trim(),

            avatar_path:
              avatarPath

          };


          const {
            error: profileSaveError
          } =
            await supabaseClient
              .from("profiles")
              .upsert(
                profileData,
                {
                  onConflict: "id"
                }
              );


          if (profileSaveError) {

            console.error(
              "Erreur sauvegarde profil:",
              profileSaveError
            );

            throw new Error(
              "Impossible d'enregistrer le profil. " +
              profileSaveError.message
            );

          }


          showMessage(
            "✅ Ton profil a été enregistré avec succès !",
            "success"
          );


          currentAvatarPath =
            avatarPath;

          selectedPhoto =
            null;


          // ====================================
          // RETOUR AU PROFIL
          // ====================================

          setTimeout(
            function () {

              window.location.href =
                "profil.html";

            },
            1200
          );

        }

        catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Une erreur est survenue.",
            "error"
          );

        }

        finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "💾 Enregistrer mon profil";

        }

      }
    );


    // ==========================================
    // DEMARRAGE
    // ==========================================

    loadProfile();

  </script>

</body>
</html>
