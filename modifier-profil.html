<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents — Modifier mon profil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, #075985 0%, transparent 35%),
        linear-gradient(135deg, #0f172a, #172554);
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 20px 10px 25px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .header h1 span {
      color: #facc15;
    }

    .header p {
      color: #94a3b8;
      margin-top: 6px;
    }

    .card {
      background: rgba(30, 41, 59, .96);
      border: 1px solid #334155;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .photo-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar-preview {
      width: 130px;
      height: 130px;
      margin: 0 auto 15px;
      border-radius: 50%;
      overflow: hidden;
      background: #0f172a;
      border: 4px solid #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-section h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .photo-section p {
      color: #94a3b8;
      font-size: .9rem;
      margin-bottom: 15px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: #f8fafc;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #facc15;
    }

    input[readonly] {
      opacity: .7;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    .buttons {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn {
      background: #facc15;
      color: #172554;
    }

    .home-btn {
      background: #0284c7;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #10b981;
    }

    .error {
      display: block;
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #ef4444;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 30px 10px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      margin-top: 20px;
      font-size: .9rem;
      padding-bottom: 20px;
    }

    footer strong {
      color: #facc15;
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">

    <div class="logo">
      <img src="logo-aigle.png" alt="Cercle des Agents">
    </div>

    <h1>
      CERCLE<span>DES</span>AGENTS
    </h1>

    <p>
      Unis • Informés • Plus forts
    </p>

  </header>


  <main class="card">

    <div id="loading" class="loading">
      Chargement de ton profil...
    </div>


    <form id="profile-form" style="display:none;">

      <!-- PHOTO -->

      <div class="photo-section">

        <div class="avatar-preview" id="avatar-preview">
          👤
        </div>

        <h2>Photo de profil</h2>

        <p>
          Choisis une photo JPG, PNG ou WebP.
          Taille maximale : 5 Mo.
        </p>

        <input
          type="file"
          id="avatar-input"
          accept="image/jpeg,image/png,image/webp"
        >

      </div>


      <!-- PRÉNOM -->

      <div class="field">

        <label for="prenom">
          Prénom
        </label>

        <input
          type="text"
          id="prenom"
          required
        >

      </div>


      <!-- NOM -->

      <div class="field">

        <label for="nom">
          Nom
        </label>

        <input
          type="text"
          id="nom"
          required
        >

      </div>


      <!-- EMAIL -->

      <div class="field">

        <label for="email">
          Adresse e-mail
        </label>

        <input
          type="email"
          id="email"
          readonly
        >

      </div>


      <!-- VILLE -->

      <div class="field">

        <label for="ville">
          📍 Ville
        </label>

        <input
          type="text"
          id="ville"
          placeholder="Ex : Abidjan"
        >

      </div>


      <!-- ENTREPRISE -->

      <div class="field">

        <label for="entreprise">
          🏢 Entreprise
        </label>

        <input
          type="text"
          id="entreprise"
          placeholder="Nom de votre entreprise"
        >

      </div>


      <!-- TYPE AGENT -->

      <div class="field">

        <label for="type_agent">
          🛡️ Type d'agent
        </label>

        <select id="type_agent">

          <option value="surete">
            Agent de sûreté
          </option>

          <option value="securite">
            Agent de sécurité
          </option>

          <option value="gardiennage">
            Agent de gardiennage
          </option>

          <option value="protection">
            Agent de protection
          </option>

          <option value="incendie">
            Agent de sécurité incendie
          </option>

          <option value="autre">
            Autre
          </option>

        </select>

      </div>


      <!-- PRÉSENTATION -->

      <div class="field">

        <label for="presentation">
          📝 Présentation
        </label>

        <textarea
          id="presentation"
          placeholder="Présente-toi aux autres agents..."
        ></textarea>

      </div>


      <div class="buttons">

        <button
          type="submit"
          class="save-btn"
          id="save-btn"
        >
          💾 Enregistrer mon profil
        </button>

        <button
          type="button"
          class="home-btn"
          onclick="window.location.href='profil.html'"
        >
          👤 Retour à mon profil
        </button>

      </div>

    </form>


    <div id="message" class="message"></div>

  </main>


  <footer>

    Cercledesagents —
    <strong>Unis • Informés • Plus forts</strong>

  </footer>

</div>


<script>

/* ============================================================
   SUPABASE
   ============================================================ */

const SUPABASE_URL =
  "https://quzgphbougaujzqrhjza.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ============================================================
   ELEMENTS
   ============================================================ */

const loading =
  document.getElementById("loading");

const form =
  document.getElementById("profile-form");

const message =
  document.getElementById("message");

const avatarInput =
  document.getElementById("avatar-input");

const avatarPreview =
  document.getElementById("avatar-preview");

const saveBtn =
  document.getElementById("save-btn");


let currentUser = null;
let currentAvatarPath = null;
let selectedPhoto = null;


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


/* ============================================================
   PUBLIC URL AVATAR
   ============================================================ */

function getAvatarUrl(path) {

  if (!path) {
    return null;
  }

  const {
    data
  } = supabaseClient
    .storage
    .from("avatars")
    .getPublicUrl(path);

  if (!data || !data.publicUrl) {
    return null;
  }

  return data.publicUrl +
    "?v=" +
    Date.now();

}


/* ============================================================
   AFFICHER AVATAR
   ============================================================ */

function displayAvatar(path) {

  const url =
    getAvatarUrl(path);

  if (url) {

    avatarPreview.innerHTML = "";

    const img =
      document.createElement("img");

    img.src = url;

    img.alt =
      "Photo de profil";

    avatarPreview.appendChild(img);

  } else {

    avatarPreview.innerHTML =
      "👤";

  }

}


/* ============================================================
   CHOIX PHOTO
   ============================================================ */

avatarInput.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) {
      return;
    }


    /* Vérification type */

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

      showMessage(
        "Format refusé. Utilise JPG, PNG ou WebP.",
        "error"
      );

      this.value = "";

      return;
    }


    /* Vérification taille */

    if (file.size > 5 * 1024 * 1024) {

      showMessage(
        "La photo est trop grande. Maximum : 5 Mo.",
        "error"
      );

      this.value = "";

      return;
    }


    selectedPhoto = file;


    /* Prévisualisation */

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        avatarPreview.innerHTML = `
          <img
            src="${event.target.result}"
            alt="Aperçu de la photo"
          >
        `;

      };

    reader.readAsDataURL(file);

  }
);


/* ============================================================
   CHARGEMENT PROFIL
   ============================================================ */

async function loadProfile() {

  try {

    const {
      data: authData,
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError) {
      throw authError;
    }


    currentUser =
      authData.user;


    if (!currentUser) {

      window.location.href =
        "connexion.html";

      return;
    }


    /* Récupération profil */

    const {
      data: profileData,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (profileError) {
      throw profileError;
    }


    const data =
      profileData || {};


    /* Valeurs */

    document.getElementById("prenom").value =
      data.prenom ||
      currentUser.user_metadata?.prenom ||
      "";

    document.getElementById("nom").value =
      data.nom ||
      currentUser.user_metadata?.nom ||
      "";

    document.getElementById("email").value =
      currentUser.email ||
      "";

    document.getElementById("ville").value =
      data.ville ||
      currentUser.user_metadata?.ville ||
      "";

    document.getElementById("entreprise").value =
      data.entreprise ||
      currentUser.user_metadata?.entreprise ||
      "";

    document.getElementById("type_agent").value =
      data.type_agent ||
      currentUser.user_metadata?.type_agent ||
      "surete";

    document.getElementById("presentation").value =
      data.presentation ||
      currentUser.user_metadata?.presentation ||
      "";


    /* Avatar existant */

    currentAvatarPath =
      data.avatar_path ||
      null;


    displayAvatar(
      currentAvatarPath
    );


    loading.style.display =
      "none";

    form.style.display =
      "block";


  } catch (error) {

    console.error(
      "Erreur chargement profil :",
      error
    );

    loading.style.display =
      "none";

    showMessage(
      "Impossible de charger ton profil : " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   ENREGISTREMENT
   ============================================================ */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    if (!currentUser) {

      showMessage(
        "Tu dois être connecté.",
        "error"
      );

      return;
    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "⏳ Enregistrement...";


    try {

      let avatarPath =
        currentAvatarPath;


      /* ======================================================
         UPLOAD PHOTO
         ====================================================== */

      if (selectedPhoto) {

        const extension =
          selectedPhoto.type === "image/png"
            ? "png"
            : selectedPhoto.type === "image/webp"
              ? "webp"
              : "jpg";


        avatarPath =
          currentUser.id +
          "/avatar." +
          extension;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("avatars")
            .upload(
              avatarPath,
              selectedPhoto,
              {
                cacheControl: "3600",
                upsert: true,
                contentType:
                  selectedPhoto.type
              }
            );


        if (uploadError) {

          console.error(
            "Erreur upload avatar :",
            uploadError
          );

          throw uploadError;
        }

      }


      /* ======================================================
         DONNÉES PROFIL
         ====================================================== */

      const profileData = {

        id:
          currentUser.id,

        prenom:
          document.getElementById(
            "prenom"
          ).value.trim(),

        nom:
          document.getElementById(
            "nom"
          ).value.trim(),

        email:
          currentUser.email,

        ville:
          document.getElementById(
            "ville"
          ).value.trim(),

        entreprise:
          document.getElementById(
            "entreprise"
          ).value.trim(),

        type_agent:
          document.getElementById(
            "type_agent"
          ).value,

        presentation:
          document.getElementById(
            "presentation"
          ).value.trim(),

        avatar_path:
          avatarPath

      };


      /* ======================================================
         ENREGISTRER DANS PROFILES
         ====================================================== */

      const {
        error: saveError
      } =
        await supabaseClient
          .from("profiles")
          .upsert(
            profileData,
            {
              onConflict: "id"
            }
          );


      if (saveError) {

        console.error(
          "Erreur sauvegarde profil :",
          saveError
        );

        throw saveError;
      }


      /* Mise à jour locale */

      currentAvatarPath =
        avatarPath;

      selectedPhoto =
        null;

      avatarInput.value =
        "";


      /* Afficher immédiatement */

      displayAvatar(
        currentAvatarPath
      );


      showMessage(
        "✅ Profil enregistré avec succès !",
        "success"
      );


      saveBtn.textContent =
        "✅ Enregistré";


      /* Retour automatique */

      setTimeout(
        function() {

          window.location.href =
            "profil.html";

        },
        1200
      );


    } catch (error) {

      console.error(
        "Erreur complète :",
        error
      );

      showMessage(
        "Impossible d'enregistrer le profil. " +
        error.message,
        "error"
      );


      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "💾 Enregistrer mon profil";

    }

  }
);


/* ============================================================
   DÉMARRAGE
   ============================================================ */

loadProfile();

</script>

</body>
</html>
