<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents — Modifier mon profil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      color: #f8fafc;
      background:
        radial-gradient(circle at top, rgba(14,165,233,.18), transparent 35%),
        linear-gradient(135deg, #07111f, #0f172a, #172554);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 10px 10px 25px;
    }

    .logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 23px;
    }

    .header p {
      color: #facc15;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
    }

    .card {
      background: rgba(16,31,51,.94);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.30);
    }

    /* PHOTO */

    .photo-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .photo-wrapper {
      width: 125px;
      height: 125px;
      margin: auto;
      position: relative;
    }

    #avatarPreview {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #facc15;
      background: linear-gradient(135deg, #facc15, #f97316);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .initials {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      font-size: 38px;
      font-weight: bold;
      pointer-events: none;
    }

    .photo-button {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 18px;
      border-radius: 12px;
      background: #172a42;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .photo-button:hover {
      background: #203b5d;
    }

    #photoInput {
      display: none;
    }

    .photo-info {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 8px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      background: #0b192b;
      color: white;
      padding: 13px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 2px rgba(14,165,233,.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .email-info {
      background: rgba(14,165,233,.08);
      border: 1px solid rgba(14,165,233,.18);
      padding: 12px;
      border-radius: 12px;
      color: #bae6fd;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .save {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #111827;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .save:disabled {
      opacity: .6;
      cursor: wait;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 17px;
      color: #93c5fd;
      font-size: 13px;
    }

    .back:hover {
      color: #facc15;
    }

    #message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
    }

    .success {
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.30);
      color: #86efac;
    }

    .error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.30);
      color: #fca5a5;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">

      <img
        src="logo-aigle.png"
        class="logo"
        alt="Cercle des Agents"
      >

      <h1>Modifier mon profil</h1>

      <p>UNIS • INFORMÉS • PLUS FORTS</p>

    </header>


    <section class="card">

      <div id="message"></div>


      <!-- PHOTO -->

      <div class="photo-section">

        <div class="photo-wrapper">

          <img
            id="avatarPreview"
            src=""
            alt="Photo de profil"
          >

          <div
            id="initials"
            class="initials"
          >
            CA
          </div>

        </div>

        <label
          for="photoInput"
          class="photo-button"
        >
          📷 Choisir ma photo
        </label>

        <input
          id="photoInput"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <div class="photo-info">
          JPG, PNG ou WebP • maximum 5 Mo
        </div>

      </div>


      <!-- EMAIL -->

      <div class="email-info">
        📧 <strong>E-mail :</strong>
        <span id="emailDisplay">Chargement...</span>
      </div>


      <!-- PRENOM -->

      <div class="form-group">

        <label for="prenom">
          Prénom
        </label>

        <input
          type="text"
          id="prenom"
          placeholder="Ton prénom"
        >

      </div>


      <!-- NOM -->

      <div class="form-group">

        <label for="nom">
          Nom
        </label>

        <input
          type="text"
          id="nom"
          placeholder="Ton nom"
        >

      </div>


      <!-- VILLE -->

      <div class="form-group">

        <label for="ville">
          Ville
        </label>

        <input
          type="text"
          id="ville"
          placeholder="Exemple : Abidjan"
        >

      </div>


      <!-- ENTREPRISE -->

      <div class="form-group">

        <label for="entreprise">
          Entreprise
        </label>

        <input
          type="text"
          id="entreprise"
          placeholder="Nom de ton entreprise"
        >

      </div>


      <!-- TYPE AGENT -->

      <div class="form-group">

        <label for="type_agent">
          Type d'agent
        </label>

        <select id="type_agent">

          <option value="">
            Sélectionner
          </option>

          <option value="surete">
            Agent de sûreté
          </option>

          <option value="securite">
            Agent de sécurité
          </option>

          <option value="gardiennage">
            Agent de gardiennage
          </option>

          <option value="controle">
            Agent de contrôle
          </option>

          <option value="superviseur">
            Superviseur
          </option>

          <option value="chef_equipe">
            Chef d'équipe
          </option>

          <option value="autre">
            Autre
          </option>

        </select>

      </div>


      <!-- PRESENTATION -->

      <div class="form-group">

        <label for="presentation">
          Présentation
        </label>

        <textarea
          id="presentation"
          placeholder="Présente-toi aux autres agents..."
        ></textarea>

      </div>


      <button
        class="save"
        id="saveBtn"
      >
        💾 Enregistrer les modifications
      </button>


      <a
        href="profil.html"
        class="back"
      >
        ← Retour à mon profil
      </a>

    </section>

  </div>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://quzgphbougaujzqrhjza.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;
    let currentProfile = null;
    let selectedPhoto = null;


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.textContent = text;

      box.className = type;

      box.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================
       INIT
    ========================================= */

    async function init() {

      const {
        data,
        error
      } = await supabaseClient.auth.getUser();


      if (error || !data?.user) {

        window.location.href =
          "connexion.html";

        return;

      }


      currentUser = data.user;


      document.getElementById("emailDisplay")
        .textContent =
          currentUser.email || "";


      await loadProfile();

    }


    /* =========================================
       CHARGER PROFIL
    ========================================= */

    async function loadProfile() {

      const {
        data,
        error
      } = await supabaseClient
        .from("profiles")
        .select(`
          id,
          prenom,
          nom,
          email,
          ville,
          entreprise,
          type_agent,
          presentation,
          avatar_path
        `)
        .eq("id", currentUser.id)
        .maybeSingle();


      if (error) {

        showMessage(
          "❌ Impossible de charger ton profil : " +
          error.message,
          "error"
        );

        return;

      }


      currentProfile = data || {};


      document.getElementById("prenom")
        .value =
          currentProfile.prenom || "";


      document.getElementById("nom")
        .value =
          currentProfile.nom || "";


      document.getElementById("ville")
        .value =
          currentProfile.ville || "";


      document.getElementById("entreprise")
        .value =
          currentProfile.entreprise || "";


      document.getElementById("type_agent")
        .value =
          currentProfile.type_agent || "";


      document.getElementById("presentation")
        .value =
          currentProfile.presentation || "";


      if (currentProfile.avatar_path) {

        displayAvatar(
          currentProfile.avatar_path
        );

      } else {

        displayInitials();

      }

    }


    /* =========================================
       INITIALes
    ========================================= */

    function getInitials() {

      const prenom =
        document.getElementById("prenom")
          .value
          .trim()
          .charAt(0)
          .toUpperCase();

      const nom =
        document.getElementById("nom")
          .value
          .trim()
          .charAt(0)
          .toUpperCase();

      return (
        (prenom + nom) || "CA"
      );

    }


    function displayInitials() {

      document.getElementById("avatarPreview")
        .style.display = "none";

      const initials =
        document.getElementById("initials");

      initials.textContent =
        getInitials();

      initials.style.display =
        "flex";

    }


    /* =========================================
       AFFICHER AVATAR EXISTANT
    ========================================= */

    function displayAvatar(path) {

      const {
        data
      } = supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(path);


      if (data?.publicUrl) {

        const image =
          document.getElementById("avatarPreview");

        image.src =
          data.publicUrl;

        image.style.display =
          "block";

        document.getElementById("initials")
          .style.display =
          "none";

      }

    }


    /* =========================================
       CHOIX PHOTO
    ========================================= */

    document
      .getElementById("photoInput")
      .addEventListener(
        "change",
        function(event) {

          const file =
            event.target.files[0];


          if (!file) {
            return;
          }


          /* Vérification format */

          const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
          ];


          if (!allowedTypes.includes(file.type)) {

            showMessage(
              "❌ Format non autorisé. Utilise JPG, PNG ou WebP.",
              "error"
            );

            this.value = "";

            return;

          }


          /* Vérification taille */

          if (file.size > 5 * 1024 * 1024) {

            showMessage(
              "❌ La photo dépasse 5 Mo.",
              "error"
            );

            this.value = "";

            return;

          }


          selectedPhoto = file;


          /* Aperçu */

          const reader =
            new FileReader();


          reader.onload =
            function(e) {

              const image =
                document.getElementById(
                  "avatarPreview"
                );

              image.src =
                e.target.result;

              image.style.display =
                "block";

              document.getElementById(
                "initials"
              ).style.display =
                "none";

            };


          reader.readAsDataURL(file);

        }
      );


    /* =========================================
       UPLOAD PHOTO
    ========================================= */

    async function uploadAvatar() {

      if (!selectedPhoto) {

        return currentProfile?.avatar_path || null;

      }


      const extension =
        selectedPhoto.name
          .split(".")
          .pop()
          .toLowerCase();


      /*
        Chaque utilisateur possède son propre dossier.
      */

      const filePath =
        currentUser.id +
        "/avatar." +
        extension;


      const {
        error
      } = await supabaseClient
        .storage
        .from("avatars")
        .upload(
          filePath,
          selectedPhoto,
          {
            cacheControl: "3600",
            upsert: true,
            contentType: selectedPhoto.type
          }
        );


      if (error) {

        throw new Error(
          "Erreur lors de l'envoi de la photo : " +
          error.message
        );

      }


      return filePath;

    }


    /* =========================================
       ENREGISTRER
    ========================================= */

    document
      .getElementById("saveBtn")
      .addEventListener(
        "click",
        async function() {

          const button = this;


          button.disabled = true;

          button.textContent =
            "⏳ Enregistrement...";


          try {

            /*
              1. Envoyer la photo si une nouvelle
              photo a été sélectionnée.
            */

            const avatarPath =
              await uploadAvatar();


            /*
              2. Récupérer les données du formulaire.
            */

            const profileData = {

              id: currentUser.id,

              prenom:
                document.getElementById("prenom")
                  .value
                  .trim(),

              nom:
                document.getElementById("nom")
                  .value
                  .trim(),

              email:
                currentUser.email,

              ville:
                document.getElementById("ville")
                  .value
                  .trim(),

              entreprise:
                document.getElementById("entreprise")
                  .value
                  .trim(),

              type_agent:
                document.getElementById("type_agent")
                  .value,

              presentation:
                document.getElementById("presentation")
                  .value
                  .trim(),

              avatar_path:
                avatarPath

            };


            /*
              3. Enregistrer dans profiles.
            */

            const {
              error
            } = await supabaseClient
              .from("profiles")
              .upsert(
                profileData,
                {
                  onConflict: "id"
                }
              );


            if (error) {

              throw new Error(
                "Impossible d'enregistrer le profil : " +
                error.message
              );

            }


            currentProfile =
              profileData;

            selectedPhoto = null;


            showMessage(
              "✅ Ton profil a été mis à jour avec succès !",
              "success"
            );


            button.textContent =
              "✅ Profil enregistré";


            setTimeout(
              function() {

                window.location.href =
                  "profil.html";

              },
              1200
            );


          } catch (error) {

            console.error(error);

            showMessage(
              "❌ " + error.message,
              "error"
            );


            button.disabled =
              false;

            button.textContent =
              "💾 Enregistrer les modifications";

          }

        }
      );


    /* =========================================
       ACTUALISER LES INITIALES
       PENDANT LA SAISIE
    ========================================= */

    document
      .getElementById("prenom")
      .addEventListener(
        "input",
        function() {

          if (!selectedPhoto &&
              !currentProfile?.avatar_path) {

            displayInitials();

          }

        }
      );


    document
      .getElementById("nom")
      .addEventListener(
        "input",
        function() {

          if (!selectedPhoto &&
              !currentProfile?.avatar_path) {

            displayInitials();

          }

        }
      );


    /* =========================================
       DÉMARRAGE
    ========================================= */

    init();

  </script>

</body>
</html>
