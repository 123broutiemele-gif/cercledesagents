<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cercle des Agents – Inscription</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      text-align: center;
    }
    p.subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #0284c7; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: et 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
    }
    .success { background: #064e3b; color: #6ee7b7; }
    .error { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cercle des Agents</h1>
    <p class="subtitle">Crée ton compte agent</p>

    <form id="signup-form">
      <label>Prénom</label>
      <input type="text" id="prenom" required placeholder="Jean">

      <label>Nom</label>
      <input type="text" id="nom" required placeholder="Dupont">

      <label>E-mail</label>
      <input type="email" id="email" required placeholder="jean@exemple.com">

      <label>Mot de passe (min. 6 caractères)</label>
      <input type="password" id="password" required minlength="6" placeholder="••••••••">

      <label>Ville</label>
      <input type="text" id="ville" required placeholder="Paris">

      <label>Entreprise</label>
      <input type="text" id="entreprise" placeholder="Nom de l’entreprise (optionnel)">

      <label>Type d’agent</label>
      <select id="type_agent" required>
        <option value="">Choisir…</option>
        <option value="commercial">Commercial</option>
        <option value="technique">Technique</option>
        <option value="support">Support</option>
        <option value="autre">Autre</option>
      </select>

      <label>Présentation</label>
      <textarea id="presentation" placeholder="Quelques mots sur toi…"></textarea>

      <button type="submit" id="submit-btn">Créer mon compte</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    // ⚠️ Remplace UNIQUEMENT ces deux valeurs par les tiennes
    const SUPABASE_URL = "https://quzgphbougaujzqrhjza.supabase.co/rest/v1/";          // Project URL
    const SUPABASE_ANON_KEY = "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1..."; // Publishable / anon key

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("signup-form");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Création en cours…";

      const prenom = document.getElementById("prenom").value.trim();
      const nom = document.getElementById("nom").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const ville = document.getElementById("ville").value.trim();
      const entreprise = document.getElementById("entreprise").value.trim();
      const type_agent = document.getElementById("type_agent").value;
      const presentation = document.getElementById("presentation").value.trim();

      try {
        // 1. Création du compte Auth
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email,
          password,
        });

        if (authError) throw authError;

        const userId = authData.user.id;

        // 2. Insertion du profil (table "profiles")
        const { error: profileError } = await supabase
          .from("profiles")
          .insert({
            id: userId,
            prenom,
            nom,
            email,
            ville,
            entreprise: entreprise || null,
            type_agent,
            presentation: presentation || null,
          });

        if (profileError) throw profileError;

        // Succès
        messageEl.className = "message success";
        messageEl.textContent = "Compte créé avec succès ! Vérifie ton e-mail pour confirmer.";
        messageEl.style.display = "block";
        form.reset();

      } catch (err) {
        messageEl.className = "message error";
        messageEl.textContent = err.message || "Une erreur est survenue.";
        messageEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Créer mon compte";
      }
    });
  </script>
</body>
                         </html>
