<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents - Connexion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;

      background:
        radial-gradient(circle at top, #075985 0%, transparent 38%),
        linear-gradient(135deg, #071426, #0f172a 55%, #172554);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(15, 23, 42, 0.96);

      border: 1px solid rgba(255, 255, 255, 0.10);

      border-radius: 24px;

      padding: 30px 25px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(14, 165, 233, 0.10);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 125px;
      height: 125px;

      object-fit: contain;

      display: block;

      margin: 0 auto 12px;

      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.4));
    }

    .brand {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;

      background: linear-gradient(
        90deg,
        #facc15,
        #fb923c,
        #38bdf8
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .motto {
      text-align: center;
      margin-top: 8px;

      color: #facc15;

      font-weight: bold;
      font-size: 13px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 28px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: bold;

      color: #e2e8f0;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 12px;

      border: 1px solid #334155;

      background: #0b1220;

      color: white;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #38bdf8;

      box-shadow:
        0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .toggle-password {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #94a3b8;

      font-size: 20px;

      cursor: pointer;

      padding: 8px;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    .forgot {
      display: block;

      text-align: right;

      margin-top: -5px;
      margin-bottom: 20px;

      color: #38bdf8;

      text-decoration: none;

      font-size: 13px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    button.login {
      width: 100%;

      border: none;

      border-radius: 13px;

      padding: 15px;

      background:
        linear-gradient(
          90deg,
          #facc15,
          #fb923c
        );

      color: #111827;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(251, 146, 60, 0.20);

      transition: 0.2s;
    }

    button.login:hover {
      transform: translateY(-1px);

      box-shadow:
        0 12px 30px rgba(251, 146, 60, 0.30);
    }

    button.login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      display: none;

      margin-top: 17px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;
    }

    #message.success {
      display: block;

      background: rgba(34, 197, 94, 0.12);

      border: 1px solid rgba(34, 197, 94, 0.30);

      color: #86efac;
    }

    #message.error {
      display: block;

      background: rgba(239, 68, 68, 0.12);

      border: 1px solid rgba(239, 68, 68, 0.30);

      color: #fca5a5;
    }

    .register {
      text-align: center;

      margin-top: 24px;

      color: #cbd5e1;

      font-size: 14px;
    }

    .register a {
      color: #facc15;

      font-weight: bold;

      text-decoration: none;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 18px;

      color: #94a3b8;

      text-decoration: none;

      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #64748b;

      font-size: 11px;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 25px 18px;

        border-radius: 20px;
      }

      .logo {
        width: 105px;
        height: 105px;
      }

      .brand {
        font-size: 22px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <!-- LOGO -->
      <div class="logo-container">

        <img
          src="logo-aigle.png"
          alt="Logo Cercle des Agents"
          class="logo"
        >

        <div class="brand">
          CERCLE DES AGENTS
        </div>

        <div class="subtitle">
          Le réseau professionnel des agents de sécurité privée
        </div>

        <div class="motto">
          Unis • Informés • Plus forts
        </div>

      </div>


      <!-- TITRE -->
      <h1>🔐 Connexion</h1>


      <!-- FORMULAIRE -->
      <form id="loginForm">

        <div class="field">

          <label for="email">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Mot de passe
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Afficher le mot de passe"
            >
              👁️
            </button>

          </div>

        </div>


        <a href="#" class="forgot" id="forgotPassword">
          Mot de passe oublié ?
        </a>


        <button
          type="submit"
          class="login"
          id="loginButton"
        >
          Se connecter
        </button>

      </form>


      <!-- MESSAGE -->
      <div id="message"></div>


      <!-- INSCRIPTION -->
      <div class="register">

        Pas encore membre ?

        <a href="inscription.html">
          Créer mon compte
        </a>

      </div>


      <a href="index.html" class="back">
        ← Retour à l'accueil
      </a>


      <div class="footer">
        © 2026 Cercle des Agents
      </div>

    </section>

  </main>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://quzgphbougaujzqrhjza.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");

    const forgotPassword =
      document.getElementById("forgotPassword");


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    // ==========================================
    // AFFICHER / MASQUER MOT DE PASSE
    // ==========================================

    togglePassword.addEventListener(
      "click",
      function () {

        if (passwordInput.type === "password") {

          passwordInput.type = "text";

          togglePassword.textContent = "🙈";

        } else {

          passwordInput.type = "password";

          togglePassword.textContent = "👁️";

        }

      }
    );


    // ==========================================
    // CONNEXION
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Veuillez remplir tous les champs.",
            "error"
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Connexion en cours…";

        message.className = "";

        message.textContent = "";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {

            console.error(
              "Erreur connexion :",
              error
            );

            let texte =
              "Impossible de vous connecter.";

            if (
              error.message
                .toLowerCase()
                .includes("invalid login credentials")
            ) {

              texte =
                "E-mail ou mot de passe incorrect.";

            } else if (
              error.message
                .toLowerCase()
                .includes("email not confirmed")
            ) {

              texte =
                "Votre adresse e-mail n'est pas encore confirmée.";

            }

            showMessage(
              texte,
              "error"
            );

            return;
          }


          if (!data.user) {

            showMessage(
              "Connexion impossible. Veuillez réessayer.",
              "error"
            );

            return;
          }


          showMessage(
            "✅ Connexion réussie ! Ouverture de votre espace…",
            "success"
          );


          // Petite pause pour afficher le message
          setTimeout(
            function () {

              window.location.href =
                "accueil.html";

            },
            700
          );

        }

        catch (error) {

          console.error(error);

          showMessage(
            "Une erreur inattendue est survenue. Vérifiez votre connexion Internet.",
            "error"
          );

        }

        finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Se connecter";

        }

      }
    );


    // ==========================================
    // MOT DE PASSE OUBLIÉ
    // ==========================================

    forgotPassword.addEventListener(
      "click",
      async function (event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Entrez d'abord votre adresse e-mail.",
            "error"
          );

          emailInput.focus();

          return;
        }


        try {

          const {
            error
          } =
            await supabaseClient.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    window.location.origin +
                    "/cercledesagents/modifier-mot-de-passe.html"
                }
              );


          if (error) {

            console.error(error);

            showMessage(
              "Impossible d'envoyer l'e-mail de récupération.",
              "error"
            );

            return;
          }


          showMessage(
            "📧 Un e-mail de récupération a été envoyé à votre adresse.",
            "success"
          );

        }

        catch (error) {

          console.error(error);

          showMessage(
            "Une erreur est survenue.",
            "error"
          );

        }

      }
    );


    // ==========================================
    // SI DÉJÀ CONNECTÉ
    // ==========================================

    async function checkExistingUser() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if (
        !error &&
        data &&
        data.user
      ) {

        window.location.href =
          "accueil.html";

      }

    }


    checkExistingUser();

  </script>

</body>
</html>
