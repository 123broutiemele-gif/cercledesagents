<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cercle des Agents — Mon profil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, #075985 0%, transparent 35%),
        linear-gradient(135deg, #0f172a, #172554);
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg, #facc15, #f97316);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .header h1 span {
      color: #facc15;
    }

    .header p {
      color: #94a3b8;
      margin-top: 6px;
    }

    .card {
      background: rgba(30, 41, 59, .96);
      border: 1px solid #334155;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .profile-top {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0f172a;
      border: 4px solid #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .profile-top h2 {
      font-size: 1.6rem;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #172554;
      color: #facc15;
      border: 1px solid #facc15;
      font-size: .9rem;
      font-weight: 700;
    }

    .info {
      margin-top: 20px;
    }

    .info-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .info-label {
      color: #94a3b8;
      font-size: .85rem;
      margin-bottom: 6px;
    }

    .info-value {
      color: #f8fafc;
      font-size: 1rem;
      word-break: break-word;
    }

    .presentation {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .buttons {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .home-btn {
      background: #facc15;
      color: #172554;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #10b981;
    }

    .error {
      display: block;
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #ef4444;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 30px 10px;
    }

    .edit-btn {
      background: #0284c7;
      color: white;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      margin-top: 20px;
      font-size: .9rem;
      padding-bottom: 20px;
    }

    footer strong {
      color: #facc15;
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">

    <div class="logo">
      🛡️
    </div>

    <h1>
      CERCLE<span>DES</span>AGENTS
    </h1>

    <p>
      Unis • Informés • Plus forts
    </p>

  </header>


  <main class="card">

    <div id="loading" class="loading">
      Chargement de ton profil...
    </div>


    <div id="profile" style="display:none;">

      <div class="profile-top">

        <div class="avatar">
          👤
        </div>

        <h2 id="nom-complet">
          —
        </h2>

        <div class="badge" id="type-agent">
          Agent
        </div>

      </div>


      <div class="info">

        <div class="info-item">

          <div class="info-label">
            📧 Adresse e-mail
          </div>

          <div class="info-value" id="email">
            —
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            📍 Ville
          </div>

          <div class="info-value" id="ville">
            Non renseignée
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            🏢 Entreprise
          </div>

          <div class="info-value" id="entreprise">
            Non renseignée
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            🛡️ Type d'agent
          </div>

          <div class="info-value" id="type-agent-detail">
            Non renseigné
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            📝 Présentation
          </div>

          <div class="info-value presentation" id="presentation">
            Aucune présentation renseignée.
          </div>

        </div>

      </div>


      <div class="buttons">

        <button
          class="edit-btn"
          onclick="window.location.href='inscription.html'"
        >
          ✏️ Modifier mon profil
        </button>

        <button
          class="home-btn"
          onclick="window.location.href='modifier-profil.html'"
          🏠 Retour à l'accueil
        </button>

        <button
          class="logout-btn"
          id="logout-btn"
        >
          🚪 Se déconnecter
        </button>

      </div>

    </div>


    <div id="message" class="message"></div>

  </main>


  <footer>
    Cercledesagents —
    <strong>Unis • Informés • Plus forts</strong>
  </footer>

</div>


<script>

/* ============================================================
   SUPABASE
   ============================================================ */

const SUPABASE_URL =
  "https://quzgphbougaujzqrhjza.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Zkqah5_D7eLKWLMp6ZFm6A_7BOyjCu1";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ============================================================
   ELEMENTS
   ============================================================ */

const loading =
  document.getElementById("loading");

const profile =
  document.getElementById("profile");

const message =
  document.getElementById("message");

const logoutBtn =
  document.getElementById("logout-btn");


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


/* ============================================================
   VALEUR DE SECOURS
   ============================================================ */

function valeur(data, metadata, champ, valeurDefaut) {

  if (
    data &&
    data[champ] !== null &&
    data[champ] !== undefined &&
    String(data[champ]).trim() !== ""
  ) {
    return data[champ];
  }

  if (
    metadata &&
    metadata[champ] !== null &&
    metadata[champ] !== undefined &&
    String(metadata[champ]).trim() !== ""
  ) {
    return metadata[champ];
  }

  return valeurDefaut;
}


/* ============================================================
   CHARGEMENT DU PROFIL
   ============================================================ */

async function loadProfile() {

  try {

    /*
     * 1 — Utilisateur connecté
     */

    const {
      data: authData,
      error: authError
    } = await supabaseClient.auth.getUser();


    if (authError) {
      throw authError;
    }


    const user = authData.user;


    /*
     * Aucun utilisateur connecté
     */

    if (!user) {

      window.location.href =
        "connexion.html";

      return;
    }


    console.log("Utilisateur connecté :", user);


    /*
     * 2 — Informations éventuellement
     * enregistrées dans Auth
     */

    const metadata =
      user.user_metadata || {};


    console.log(
      "Métadonnées utilisateur :",
      metadata
    );


    /*
     * 3 — Recherche du profil
     */

    const {
      data: profileData,
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


    if (profileError) {

      console.error(
        "Erreur profiles :",
        profileError
      );

      throw profileError;
    }


    console.log(
      "Profil Supabase :",
      profileData
    );


    /*
     * 4 — Si aucune ligne profiles,
     * on utilise quand même Auth.
     */

    const data =
      profileData || {};


    /*
     * 5 — Récupération des valeurs
     */

    const prenom =
      valeur(
        data,
        metadata,
        "prenom",
        ""
      );

    const nom =
      valeur(
        data,
        metadata,
        "nom",
        ""
      );

    const email =
      data.email ||
      metadata.email ||
      user.email ||
      "Non renseigné";

    const ville =
      valeur(
        data,
        metadata,
        "ville",
        "Non renseignée"
      );

    const entreprise =
      valeur(
        data,
        metadata,
        "entreprise",
        "Non renseignée"
      );

    const typeAgent =
      valeur(
        data,
        metadata,
        "type_agent",
        "Agent"
      );

    const presentation =
      valeur(
        data,
        metadata,
        "presentation",
        "Aucune présentation renseignée."
      );


    /*
     * 6 — Nom complet
     */

    const nomComplet =
      `${prenom} ${nom}`.trim();


    document.getElementById(
      "nom-complet"
    ).textContent =
      nomComplet || "Agent";


    /*
     * 7 — Affichage
     */

    document.getElementById(
      "email"
    ).textContent =
      email;


    document.getElementById(
      "ville"
    ).textContent =
      ville;


    document.getElementById(
      "entreprise"
    ).textContent =
      entreprise;


    document.getElementById(
      "type-agent"
    ).textContent =
      typeAgent;


    document.getElementById(
      "type-agent-detail"
    ).textContent =
      typeAgent;


    document.getElementById(
      "presentation"
    ).textContent =
      presentation;


    /*
     * 8 — Affichage de la page
     */

    loading.style.display =
      "none";

    profile.style.display =
      "block";


  } catch (error) {

    console.error(
      "Erreur chargement profil :",
      error
    );

    loading.style.display =
      "none";


    showMessage(
      "Impossible de charger ton profil : " +
      (error.message || "Erreur inconnue"),
      "error"
    );

  }

}


/* ============================================================
   DÉCONNEXION
   ============================================================ */

logoutBtn.addEventListener(
  "click",
  async () => {

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "Déconnexion...";


    const {
      error
    } =
      await supabaseClient.auth.signOut();


    if (error) {

      console.error(error);

      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "🚪 Se déconnecter";

      showMessage(
        "Erreur lors de la déconnexion : " +
        error.message,
        "error"
      );

      return;
    }


    window.location.href =
      "connexion.html";

  }
);


/* ============================================================
   DÉMARRAGE
   ============================================================ */

loadProfile();

</script>

</body>
</html>
